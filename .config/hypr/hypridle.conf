general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/idle.sh screen-on
}

# Every step below runs on battery only: plugged in, nothing happens (scripts/idle.sh)

# 2.5 min: dim screen and keyboard
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle.sh dim
    on-resume = ~/.config/hypr/scripts/idle.sh undim
}
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle.sh kbd-off
    on-resume = ~/.config/hypr/scripts/idle.sh kbd-on
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle.sh lock
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/idle.sh screen-off
    on-resume = ~/.config/hypr/scripts/idle.sh screen-on
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle.sh suspend
}
