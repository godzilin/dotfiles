# Catppuccin Mocha
$mauve = rgb(cba6f7)
$text  = rgb(cdd6f4)
$base  = rgb(1e1e2e)
$red   = rgb(f38ba8)
$font  = FantasqueSansM Nerd Font

general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 300, 55
    outline_thickness = 3
    rounding = 14
    outer_color = $mauve
    inner_color = $base
    font_color = $text
    fail_color = $red
    check_color = rgb(89b4fa)
    placeholder_text = <i>Contraseña…</i>
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
