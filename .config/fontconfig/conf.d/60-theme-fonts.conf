<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts that only exist while their theme is active (e.g. W95FA for azul); `tema` runs fc-cache on switch -->
<fontconfig>
  <dir>~/.config/dotfiles/themes/current/fonts</dir>
  <!-- Pixel fonts (W95FA, DOS VGA): crisp, not smoothed, like on a 1995 screen -->
  <match target="font">
    <test name="family"><string>W95FA</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family"><string>More Perfect DOS VGA</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <!-- Fontsource's static Nunito (verde/fonts) names its family "Nunito ExtraLight": call it Nunito -->
  <match target="scan">
    <test name="family"><string>Nunito ExtraLight</string></test>
    <edit name="family" mode="assign" binding="same"><string>Nunito</string></edit>
  </match>
</fontconfig>
