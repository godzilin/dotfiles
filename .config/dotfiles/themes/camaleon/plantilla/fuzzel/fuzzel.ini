[main]
font=Nunito:size=12:weight=semibold
terminal=alacritty -e
prompt="  "
placeholder=Buscar…
icon-theme=Papirus-Dark
icons-enabled=yes
dpi-aware=no
width=44
lines=9
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=22
letter-spacing=0

# Camaleón palette
[colors]
background={{bg}}f2
text={{sub}}ff
prompt="  "
placeholder={{faint}}ff
input={{text}}ff
match={{accent}}ff
selection={{bg2}}ff
selection-text={{text}}ff
selection-match={{accent}}ff
border={{line}}ff

[border]
width=1
radius=18
