# Spotlight: big search field in the upper third, translucent light panel
[main]
font=Inter:size=15,Symbols Nerd Font:size=14
use-bold=yes
terminal=alacritty -e
prompt="  "
placeholder=Búsqueda en Spotlight
icon-theme=WhiteSur-light
icons-enabled=yes
dpi-aware=no
anchor=top
y-margin=250
width=46
lines=8
horizontal-pad=16
vertical-pad=12
inner-pad=10
line-height=34
image-size-ratio=0.5

[colors]
background=f6f6f6d9
text=1d1d1fff
prompt=8e8e93ff
placeholder=8e8e93ff
input=1d1d1fff
match=1d1d1fff
selection=007affff
selection-text=ffffffff
selection-match=ffffffff
counter=8e8e93ff
border=00000020

[border]
width=1
radius=14
selection-radius=8
