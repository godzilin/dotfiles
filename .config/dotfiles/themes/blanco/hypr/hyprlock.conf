# macOS (Sonoma) lock screen: date and big clock on top, user and password pill at the bottom
$ui      = Inter
$display = Inter Display

general {
    hide_cursor = false
}

background {
    path = ~/.config/dotfiles/themes/current/wallpapers/rotation/c-colinas-lago.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.92
}

# "jueves, 15 de octubre"
label {
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = $display SemiBold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.18)
    position = 0, -90
    halign = center
    valign = top
}

label {
    text = cmd[update:1000] date +"%-H:%M"
    color = rgba(255, 255, 255, 0.86)
    font_size = 118
    font_family = $display SemiBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.15)
    position = 0, -120
    halign = center
    valign = top
}

# User picture: grey circle with the initial, like an account without photo
shape {
    size = 76, 76
    rounding = -1
    color = rgba(160, 165, 175, 0.85)
    border_size = 0
    position = 0, 190
    halign = center
    valign = bottom
}
label {
    text = cmd[update:0] n=$(getent passwd $USER | cut -d: -f5 | cut -d, -f1); echo "${n:-$USER}" | cut -c1 | tr a-z A-Z
    color = rgba(255, 255, 255, 1.0)
    font_size = 30
    font_family = $ui Medium
    position = 0, 210
    halign = center
    valign = bottom
}
label {
    text = cmd[update:0] n=$(getent passwd $USER | cut -d: -f5 | cut -d, -f1); echo "${n:-$USER}"
    color = rgba(255, 255, 255, 0.95)
    font_size = 14
    font_family = $ui SemiBold
    shadow_passes = 1
    shadow_color = rgba(0, 0, 0, 0.2)
    position = 0, 158
    halign = center
    valign = bottom
}

input-field {
    size = 200, 32
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.28)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = $ui
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(255, 59, 48, 0.55)
    fail_text = Contraseña incorrecta
    placeholder_text = <span color="##ffffffbb">Introducir contraseña</span>
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, 108
    halign = center
    valign = bottom
}
