# Hi-Fi palette
$bg     = rgb(1e1610)
$line   = rgb(57432f)
$muted  = rgb(9a8468)
$text   = rgb(efe3cb)
$amber  = rgb(f28c28)
$red    = rgb(d6503a)
$mono   = DM Mono

general {
    hide_cursor = true
}

background {
    path = ~/.config/dotfiles/themes/current/wallpapers/rotation/a-nogal.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
}

# Header, printed on the panel
label {
    text = STANDBY
    color = $text
    font_size = 24
    font_family = Michroma
    position = 0, 190
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 110
    font_family = $mono Light
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A %d %B" | tr '[:lower:]' '[:upper:]'
    color = $muted
    font_size = 13
    font_family = $mono
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    size = 280, 44
    outline_thickness = 1
    rounding = 10
    outer_color = $line
    inner_color = $bg
    font_color = $text
    font_family = $mono
    check_color = $amber
    fail_color = $red
    fail_text = ACCESS DENIED
    placeholder_text = <span color="##9a8468">ENTER PASSCODE</span>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    text = cmd[update:30000] echo "$(whoami | tr a-z A-Z)  ·  BAT $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 10
    font_family = $mono
    position = 0, 40
    halign = center
    valign = bottom
}
