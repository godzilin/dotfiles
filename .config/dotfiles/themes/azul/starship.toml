# DOS-style prompt on Linux: "ARCH:\HOME\GODZILIN>" (the real path in uppercase with backslashes, Arch as the drive)
add_newline = false
format = "${custom.dos}$character"

[custom.dos]
command = "pwd | sed 's|/|\\\\|g' | tr '[:lower:]' '[:upper:]'"
when = "true"
format = "ARCH:$output"
shell = ["sh"]

[character]
success_symbol = ">"
error_symbol = ">"
vimcmd_symbol = ">"
