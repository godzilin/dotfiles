# Windows 95 logon: teal desktop and the "Bienvenido a Windows" dialog. Bevels are stacked shapes
# (white top-left, black/grey bottom-right) under the grey face. Coordinates are offsets from the screen centre.
# Every widget has a zindex in file order: hyprlock does not keep the declaration order on its own.
$font  = W95FA
$face  = rgb(c0c0c0)

general {
    hide_cursor = false
}

background {
    color = rgb(008080)
}

# Dialog: dark edge, light edge, grey face
shape {
    zindex = 1
    size = 482, 222
    color = rgb(000000)
    rounding = 0
    position = 1, -1
    halign = center
    valign = center
}
shape {
    zindex = 2
    size = 482, 222
    color = rgb(dfdfdf)
    rounding = 0
    position = -1, 1
    halign = center
    valign = center
}
shape {
    zindex = 3
    size = 480, 220
    color = $face
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# Title bar
shape {
    zindex = 4
    size = 472, 22
    color = rgb(000080)
    border_size = 0
    rounding = 0
    position = 0, 95
    halign = center
    valign = center
}
label {
    zindex = 5
    text = Bienvenido a Windows
    color = rgb(ffffff)
    font_size = 12
    font_family = $font
    position = -158, 95
    halign = center
    valign = center
}

image {
    zindex = 6
    path = ~/.local/share/icons/Chicago95/apps/32/system-log-out.png
    size = 32
    rounding = 0
    border_size = 0
    position = -200, 52
    halign = center
    valign = center
}
label {
    zindex = 7
    text = Escriba la contraseña para iniciar sesión.
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = -42, 58
    halign = center
    valign = center
}

# User name: label and a sunken white box
label {
    zindex = 8
    text = Nombre de usuario:
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = -128, 14
    halign = center
    valign = center
}
shape {
    zindex = 9
    size = 182, 24
    color = rgb(808080)
    rounding = 0
    position = 30, 15
    halign = center
    valign = center
}
shape {
    zindex = 10
    size = 180, 22
    color = rgb(ffffff)
    rounding = 0
    position = 31, 14
    halign = center
    valign = center
}
label {
    zindex = 11
    text = $USER
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = -28, 14
    halign = center
    valign = center
}

# Password
label {
    zindex = 12
    text = Contraseña:
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = -151, -20
    halign = center
    valign = center
}
input-field {
    zindex = 13
    size = 182, 24
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(808080)
    inner_color = rgb(ffffff)
    font_color = rgb(000000)
    font_family = $font
    check_color = rgb(000080)
    fail_color = rgb(ff0000)
    fail_text = Contraseña incorrecta
    placeholder_text =
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = -1
    fade_on_empty = false
    fade_timeout = 0
    position = 30, -20
    halign = center
    valign = center
}

# Buttons on the right (Enter accepts)
shape {
    zindex = 14
    size = 82, 26
    color = rgb(000000)
    rounding = 0
    position = 186, 13
    halign = center
    valign = center
}
shape {
    zindex = 15
    size = 80, 24
    color = $face
    border_size = 1
    border_color = rgb(ffffff) rgb(808080) 135deg
    rounding = 0
    position = 186, 13
    halign = center
    valign = center
}
label {
    zindex = 16
    text = Aceptar
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = 186, 13
    halign = center
    valign = center
}
shape {
    zindex = 17
    size = 80, 24
    color = $face
    border_size = 1
    border_color = rgb(ffffff) rgb(808080) 135deg
    rounding = 0
    position = 186, -20
    halign = center
    valign = center
}
label {
    zindex = 18
    text = Cancelar
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = 186, -20
    halign = center
    valign = center
}

label {
    zindex = 19
    text = cmd[update:30000] echo "Hora: $(date +%H:%M)      Batería: $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(000000)
    font_size = 12
    font_family = $font
    position = 0, -78
    halign = center
    valign = center
}
