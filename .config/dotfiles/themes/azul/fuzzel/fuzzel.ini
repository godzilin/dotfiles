# Windows 95 list box: grey face, navy selection, square
[main]
font=W95FA:pixelsize=16,Symbols Nerd Font:size=11
terminal=alacritty -e
prompt="Abrir: "
placeholder=Escriba el nombre de un programa
icon-theme=Chicago95
icons-enabled=yes
dpi-aware=no
anchor=bottom-left
x-margin=2
y-margin=34
width=40
lines=12
horizontal-pad=6
vertical-pad=6
inner-pad=6
line-height=22
image-size-ratio=0.7

[colors]
background=c0c0c0ff
text=000000ff
prompt=000000ff
placeholder=808080ff
input=000000ff
match=000080ff
selection=000080ff
selection-text=ffffffff
selection-match=ffff00ff
counter=808080ff
border=000000ff

[border]
width=2
radius=0
selection-radius=0
