# Astrolabio prompt: one line, quiet, a brass star as the mark
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "nostromo"
format = "$directory$git_branch$git_state$git_status$python$cmd_duration$status$character"

[palettes.nostromo]
text = "#e4dcc8"
sub = "#b9b3a4"
muted = "#858b9a"
line = "#555e72"
amber = "#d6b16a"
orange = "#d99c62"
red = "#dc7f70"
green = "#9dbb8f"

[directory]
style = "sub"
truncation_length = 3
truncation_symbol = "…/"
read_only = " RO"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "muted"
format = "[/ $branch]($style)"

[git_status]
style = "amber"
format = "[ $all_status$ahead_behind]($style) "
modified = "*"
staged = "+"
untracked = "?"
deleted = "x"
renamed = "r"
stashed = "s"
ahead = "↑"
behind = "↓"
diverged = "↕"
conflicted = "!"

[git_state]
style = "orange"
format = "[$state( $progress_current/$progress_total)]($style) "

[python]
symbol = "py "
style = "muted"
format = "[$symbol$virtualenv]($style) "
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 3000
style = "muted"
format = "[$duration]($style) "

[status]
disabled = false
style = "red"
format = "[$status]($style) "

[character]
success_symbol = "[✦](amber)"
error_symbol = "[✦](red)"
vimcmd_symbol = "[✧](green)"
