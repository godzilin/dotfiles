# Astrolabio palette
$bg     = rgb(131824)
$line   = rgb(333c50)
$muted  = rgb(858b9a)
$text   = rgb(e4dcc8)
$amber  = rgb(d6b16a)
$red    = rgb(dc7f70)

general {
    hide_cursor = true
}

background {
    path = ~/.config/dotfiles/themes/current/wallpapers/rotation/b-astrolabio.jpg
    blur_passes = 1
    blur_size = 3
    brightness = 0.85
}

label {
    text = La cúpula está cerrada
    color = $amber
    font_size = 19
    font_family = Alegreya Italic
    position = 0, 205
    halign = center
    valign = center
    zindex = 2
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 118
    font_family = Alegreya
    position = 0, 90
    halign = center
    valign = center
    zindex = 2
}

label {
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    color = $muted
    font_size = 16
    font_family = Alegreya Sans
    position = 0, -20
    halign = center
    valign = center
    zindex = 2
}

input-field {
    size = 300, 46
    outline_thickness = 1
    rounding = 10
    outer_color = $amber
    inner_color = rgba(131824dd)
    font_color = $text
    font_family = Alegreya Sans
    check_color = $amber
    fail_color = $red
    fail_text = No es esa
    placeholder_text = <span color="##858b9a">Contraseña</span>
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -92
    halign = center
    valign = center
    zindex = 2
}

label {
    text = cmd[update:600000] echo "$(python3 ~/.config/dotfiles/themes/current/scripts/luna.py --texto)  ·  batería $(cat /sys/class/power_supply/BAT0/capacity) %"
    color = $muted
    font_size = 13
    font_family = Alegreya Sans
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 2
}
