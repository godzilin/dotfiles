# Bosque palette. The misty firs behind, the time in a soft serif, a rounded stone for the password.
# Every widget has a zindex (hyprlock ignores file order).
$bg     = rgb(151c15)
$line   = rgb(34432f)
$muted  = rgb(aab89a)
$text   = rgb(e4e6d0)
$moss   = rgb(9cc26b)
$red    = rgb(c0624a)
$serif  = Fraunces
$sans   = Nunito

general {
    hide_cursor = true
}

background {
    path = ~/.config/dotfiles/themes/verde/wallpapers/rotation/a-niebla.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.6
    zindex = 0
}

label {
    text = cmd[update:60000] h=$(date +%H); if [ $h -lt 7 ]; then echo "Buenas noches"; elif [ $h -lt 13 ]; then echo "Buenos días"; elif [ $h -lt 21 ]; then echo "Buenas tardes"; else echo "Buenas noches"; fi
    color = $muted
    font_size = 18
    font_family = $serif Italic
    position = 0, 220
    halign = center
    valign = center
    zindex = 1
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 120
    font_family = $serif
    position = 0, 100
    halign = center
    valign = center
    zindex = 1
}

label {
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    color = $muted
    font_size = 15
    font_family = $sans
    position = 0, -10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    size = 300, 50
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(9cc26b88)
    inner_color = rgba(151c15dd)
    font_color = $text
    font_family = $sans
    check_color = $moss
    fail_color = $red
    fail_text = Inténtalo otra vez
    placeholder_text = <span color="##aab89a">Contraseña</span>
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
    zindex = 2
}

label {
    text = cmd[update:30000] echo "$(whoami)  ·  batería $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 11
    font_family = $sans
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 1
}
