# Fósforo: a mainframe logon panel, left-aligned like a 3270 screen, on pure black.
# Every widget has a zindex in file order: hyprlock does not keep the declaration order on its own.
$bg    = rgb(000000)
$line  = rgb(1a3a1d)
$muted = rgb(3f9147)
$text  = rgb(a6ffad)
$phos  = rgb(33ff4d)
$red   = rgb(ff5a4a)
$mono  = 3270 Nerd Font Mono

general {
    hide_cursor = true
}

background {
    color = $bg
}

label {
    zindex = 1
    text = cmd[update:1000] echo "TERMINAL $(hostnamectl hostname | tr a-z A-Z)                      $(date +%Y-%m-%d)  $(date +%H:%M:%S)"
    color = $muted
    font_size = 16
    font_family = $mono
    position = 120, -100
    halign = left
    valign = top
}

label {
    zindex = 2
    text = SESSION LOCKED
    color = $text
    font_size = 64
    font_family = $mono
    position = 120, -170
    halign = left
    valign = top
}

label {
    zindex = 3
    text = cmd[update:60000] echo "USERID   ===> $(whoami | tr a-z A-Z)"
    color = $text
    font_size = 20
    font_family = $mono
    position = 120, -330
    halign = left
    valign = top
}

label {
    zindex = 4
    text = PASSWORD ===>
    color = $text
    font_size = 20
    font_family = $mono
    position = 120, -384
    halign = left
    valign = top
}

input-field {
    zindex = 5
    size = 420, 36
    outline_thickness = 0
    rounding = 0
    outer_color = $bg
    inner_color = $bg
    font_color = $phos
    font_family = $mono
    check_color = $phos
    fail_color = $red
    fail_text = <span color="##ff5a4a">ACCESS DENIED · RETRY</span>
    placeholder_text =
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    position = 300, -376
    halign = left
    valign = top
}

label {
    zindex = 6
    text = cmd[update:30000] echo "BAT $(cat /sys/class/power_supply/BAT0/capacity)%   ENTER=UNLOCK"
    color = $muted
    font_size = 16
    font_family = $mono
    position = 120, 90
    halign = left
    valign = bottom
}

label {
    zindex = 7
    text = READY▮
    color = $phos
    font_size = 16
    font_family = $mono
    position = 120, 60
    halign = left
    valign = bottom
}
