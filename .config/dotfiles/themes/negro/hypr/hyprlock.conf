# Fósforo: a mainframe logon panel, left-aligned like a 3270 screen, framed, over a dim wireframe landscape.
# Every widget has a zindex in file order: hyprlock does not keep the declaration order on its own.
$bg    = rgb(000000)
$line  = rgb(1a3a1d)
$muted = rgb(3f9147)
$text  = rgb(a6ffad)
$phos  = rgb(33ff4d)
$red   = rgb(ff5a4a)
$mono  = 3270 Nerd Font Mono

general {
    hide_cursor = true
}

background {
    color = $bg
    path = ~/.config/dotfiles/themes/negro/wallpapers/bloqueo.png
}

# Status bar: black text on a phosphor stripe
shape {
    zindex = 1
    size = 1920, 34
    color = $phos
    rounding = 0
    position = 0, 0
    halign = left
    valign = top
}

label {
    zindex = 2
    text = cmd[update:1000] echo "SYSTEM $(hostnamectl hostname | tr a-z A-Z)   LOGON   $(date +%Y-%m-%d)  $(date +%H:%M:%S)"
    color = $bg
    font_size = 18
    font_family = $mono
    position = 24, -6
    halign = left
    valign = top
}

# Frame around the panel
shape {
    zindex = 3
    size = 1000, 640
    color = rgba(00000000)
    rounding = 0
    border_size = 2
    border_color = $phos
    position = 100, -100
    halign = left
    valign = top
}

label {
    zindex = 4
    text = cmd[update:60000] echo "TERMINAL $(tty | tr a-z A-Z)  ·  $(uname -m)"
    color = $muted
    font_size = 16
    font_family = $mono
    position = 140, -124
    halign = left
    valign = top
}

shape {
    zindex = 5
    size = 920, 2
    color = $line
    rounding = 0
    position = 140, -158
    halign = left
    valign = top
}

label {
    zindex = 6
    text = SESSION LOCKED
    color = $text
    font_size = 64
    font_family = $mono
    position = 140, -176
    halign = left
    valign = top
}

label {
    zindex = 7
    text = cmd[update:1000] date +%H:%M
    color = $phos
    font_size = 120
    font_family = $mono
    position = 140, -262
    halign = left
    valign = top
}

label {
    zindex = 8
    text = cmd[update:60000] date "+%A %d %B %Y" | tr a-z A-Z
    color = $muted
    font_size = 18
    font_family = $mono
    position = 146, -400
    halign = left
    valign = top
}

shape {
    zindex = 9
    size = 920, 2
    color = $line
    rounding = 0
    position = 140, -440
    halign = left
    valign = top
}

label {
    zindex = 10
    text = cmd[update:30000] printf '%-9s %s\n%-9s %s\n%-9s %s' USERID "$(whoami | tr a-z A-Z)" KERNEL "$(uname -r)" POWER "BAT $(cat /sys/class/power_supply/BAT0/capacity)% $([ "$(cat /sys/class/power_supply/AC/online)" = 1 ] && echo ON AC || echo ON BATTERY)"
    color = $text
    font_size = 20
    font_family = $mono
    position = 140, -460
    halign = left
    valign = top
}

shape {
    zindex = 11
    size = 920, 2
    color = $line
    rounding = 0
    position = 140, -560
    halign = left
    valign = top
}

label {
    zindex = 12
    text = PASSWORD ===>
    color = $text
    font_size = 20
    font_family = $mono
    position = 140, -592
    halign = left
    valign = top
}

input-field {
    zindex = 13
    size = 420, 36
    outline_thickness = 0
    rounding = 0
    outer_color = $bg
    inner_color = $bg
    font_color = $phos
    font_family = $mono
    check_color = $phos
    fail_color = $red
    fail_text = <span color="##ff5a4a">ACCESS DENIED · RETRY</span>
    placeholder_text =
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    position = 320, -584
    halign = left
    valign = top
}

label {
    zindex = 14
    text = ENTER=UNLOCK
    color = $muted
    font_size = 16
    font_family = $mono
    position = 140, -640
    halign = left
    valign = top
}

label {
    zindex = 15
    text = cmd[update:5000] echo "LOAD $(cut -d' ' -f1 /proc/loadavg)   MEM $(free | awk '/Mem/{printf "%d%%", $3*100/$2}')"
    color = $muted
    font_size = 16
    font_family = $mono
    position = 120, 90
    halign = left
    valign = bottom
}

label {
    zindex = 16
