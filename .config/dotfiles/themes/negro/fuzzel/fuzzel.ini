[main]
font=3270 Nerd Font Mono:size=14
terminal=alacritty -e
prompt="> "
placeholder=READY.
icon-theme=Papirus-Verde
icons-enabled=yes
dpi-aware=no
width=44
lines=9
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=22
letter-spacing=0.5

# Fósforo palette: inverse-video selection
[colors]
background=000000ff
text=63cc6cff
prompt=33ff4dff
placeholder=275529ff
input=a6ffadff
match=33ff4dff
selection=33ff4dff
selection-text=000000ff
selection-match=000000ff
border=33ff4dff

[border]
width=1
radius=0
