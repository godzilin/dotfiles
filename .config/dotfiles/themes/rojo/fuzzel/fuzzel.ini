# Constructivist launcher: a paper card with a thick ink frame, red stamp on the selection
[main]
font=Oswald:size=15:weight=medium,Symbols Nerd Font:size=13
use-bold=yes
terminal=alacritty -e
prompt="▶ "
placeholder=ЧТО СТРОИМ СЕГОДНЯ?
icon-theme=Papirus-Rojo
icons-enabled=yes
dpi-aware=no
anchor=top-left
x-margin=0
y-margin=48
width=34
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=34
letter-spacing=1

[colors]
background=efe6d2ff
text=141414ff
prompt=d42a1eff
placeholder=8a8274ff
input=141414ff
match=d42a1eff
selection=d42a1eff
selection-text=efe6d2ff
selection-match=141414ff
counter=8a8274ff
border=141414ff

[border]
width=4
radius=0
selection-radius=0
