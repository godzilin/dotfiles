# Constructivist lock screen: a poster. Red circle, a black band on the diagonal carrying the user's name,
# the time huge in ink, the password in a black block. Every widget has a zindex (hyprlock ignores file order).
$head = Oswald
$disp = Russo One

general {
    hide_cursor = false
}

background {
    color = rgb(efe6d2)
}

# Red sun on the left
shape {
    zindex = 1
    size = 620, 620
    color = rgb(d42a1e)
    rounding = -1
    position = -520, 120
    halign = center
    valign = center
}

# Black band across the sheet, on the diagonal
# (three segments along one line: hyprlock clips a single very wide rotated shape)
shape {
    zindex = 2
    size = 1100, 150
    color = rgb(141414)
    rounding = 0
    rotate = -14
    position = -1000, 99
    halign = center
    valign = center
}
shape {
    zindex = 2
    size = 1100, 150
    color = rgb(141414)
    rounding = 0
    rotate = -14
    position = 0, -150
    halign = center
    valign = center
}
shape {
    zindex = 2
    size = 1100, 150
    color = rgb(141414)
    rounding = 0
    rotate = -14
    position = 1000, -399
    halign = center
    valign = center
}
label {
    zindex = 3
    text = cmd[update:0] echo "ТОВАРИЩ $(~/.config/dotfiles/themes/current/scripts/ru.sh name)"
    color = rgb(efe6d2)
    font_size = 54
    font_family = $disp
    rotate = -14
    position = -260, -95
    halign = center
    valign = center
}

# Thin red rules, like a poster's composition lines
shape {
    zindex = 4
    size = 900, 10
    color = rgb(d42a1e)
    rounding = 0
    rotate = -14
    position = 380, -128
    halign = center
    valign = center
}
shape {
    zindex = 5
    size = 14, 420
    color = rgb(141414)
    rounding = 0
    rotate = 16
    position = 860, 260
    halign = center
    valign = center
}

# The time, huge
label {
    zindex = 6
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(141414)
    font_size = 190
    font_family = $head Bold
    position = 330, 230
    halign = center
    valign = center
}
label {
    zindex = 7
    text = cmd[update:60000] ~/.config/dotfiles/themes/current/scripts/ru.sh lock
    color = rgb(d42a1e)
    font_size = 30
    font_family = $head SemiBold
    position = 330, 60
    halign = center
    valign = center
}

# Password: a black block, paper text
input-field {
    zindex = 8
    size = 420, 64
    outline_thickness = 0
    rounding = 0
    inner_color = rgb(141414)
    font_color = rgb(efe6d2)
    font_family = $head
    check_color = rgb(d42a1e)
    fail_color = rgb(d42a1e)
    fail_text = <span font_family="Oswald" letter_spacing="2048">ДОСТУП ЗАПРЕЩЁН</span>
    placeholder_text = <span font_family="Oswald" foreground="##8a8274" letter_spacing="2048">ПАРОЛЬ</span>
    dots_size = 0.28
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    position = 330, -400
    halign = center
    valign = center
}
shape {
    zindex = 9
    size = 64, 64
    color = rgb(d42a1e)
    rounding = 0
    position = 100, -400
    halign = center
    valign = center
}
label {
    zindex = 10
    text = ▶
    color = rgb(efe6d2)
    font_size = 22
    font_family = DejaVu Sans
    position = 100, -400
    halign = center
    valign = center
}

label {
    zindex = 11
    text = cmd[update:30000] echo "ЭНЕРГИЯ $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(141414)
    font_size = 16
    font_family = $head SemiBold
    position = -70, 40
    halign = right
    valign = bottom
}
