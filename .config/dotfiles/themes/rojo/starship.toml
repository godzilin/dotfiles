# Rojo: the folder stamped in a red block, then an ink arrow
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
truncation_length = 3
home_symbol = "~"
format = "[ $path ]($style)[$read_only]($read_only_style) "
style = "bold fg:#efe6d2 bg:#d42a1e"

[git_branch]
format = "[ $branch ](bold fg:#efe6d2 bg:#141414) "
symbol = ""

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold fg:#d42a1e"

[cmd_duration]
format = "[$duration](fg:#5e574b) "

[character]
success_symbol = "[▶](bold fg:#141414)"
error_symbol = "[▶](bold fg:#d42a1e)"
vimcmd_symbol = "[◀](bold fg:#141414)"
