# NeXTSTEP login panel on the dark grey Workspace: a light grey panel with a white top-left bevel, a black
# bottom-right edge and the hard drop shadow, the grey cube on the left, Name and Password in sunken white fields.
# Coordinates are offsets from the screen centre. Every widget has a zindex in file order (hyprlock needs it).
$sans  = Nimbus Sans
$face  = rgb(aaaaaa)

general {
    hide_cursor = false
}

background {
    color = rgb(555555)
}

# Panel: shadow, black edge, white edge, grey face
shape {
    zindex = 1
    size = 620, 300
    color = rgb(000000)
    rounding = 0
    position = 6, -6
    halign = center
    valign = center
}
shape {
    zindex = 2
    size = 620, 300
    color = rgb(000000)
    rounding = 0
    position = 1, -1
    halign = center
    valign = center
}
shape {
    zindex = 3
    size = 620, 300
    color = rgb(ffffff)
    rounding = 0
    position = -1, 1
    halign = center
    valign = center
}
shape {
    zindex = 4
    size = 618, 298
    color = $face
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

image {
    zindex = 5
    path = ~/.config/dotfiles/themes/current/hypr/cube.png
    size = 120
    rounding = 0
    border_size = 0
    position = -200, 40
    halign = center
    valign = center
}
label {
    zindex = 6
    text = cmd[update:60000] hostnamectl hostname
    color = rgb(000000)
    font_size = 30
    font_family = $sans Bold
    position = 60, 90
    halign = center
    valign = center
}
label {
    zindex = 7
    text = cmd[update:60000] date +"%A %d de %B · %H:%M"
    color = rgb(555555)
    font_size = 12
    font_family = $sans
    position = 60, 52
    halign = center
    valign = center
}

# Name: label and a sunken white field
label {
    zindex = 8
    text = Nombre:
    color = rgb(000000)
    font_size = 13
    font_family = $sans
    position = -40, 0
    halign = center
    valign = center
}
shape {
    zindex = 9
    size = 222, 28
    color = rgb(555555)
    rounding = 0
    position = 109, 1
    halign = center
    valign = center
}
shape {
    zindex = 10
    size = 220, 26
    color = rgb(ffffff)
    rounding = 0
    position = 110, 0
    halign = center
    valign = center
}
label {
    zindex = 11
    text = $USER
    color = rgb(000000)
    font_size = 13
    font_family = $sans
    position = 38, 0
    halign = center
    valign = center
}

# Password
label {
    zindex = 12
    text = Contraseña:
    color = rgb(000000)
    font_size = 13
    font_family = $sans
    position = -53, -40
    halign = center
    valign = center
}
shape {
    zindex = 13
    size = 222, 28
    color = rgb(555555)
    rounding = 0
    position = 109, -39
    halign = center
    valign = center
}
input-field {
    zindex = 14
    size = 220, 26
    outline_thickness = 0
    rounding = 0
    outer_color = rgb(ffffff)
    inner_color = rgb(ffffff)
    font_color = rgb(000000)
    font_family = $sans
    check_color = rgb(000000)
    fail_color = rgb(a02828)
    fail_text = Contraseña incorrecta
    placeholder_text =
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    position = 110, -40
    halign = center
    valign = center
}

label {
    zindex = 15
    text = cmd[update:30000] echo "Batería $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(555555)
    font_size = 11
    font_family = $sans
    position = 0, -120
    halign = center
    valign = center
}
