# NeXTSTEP open panel: light grey, black outline, white row for the selection
[main]
font=Nimbus Sans:size=12
terminal=alacritty -e
prompt="Abrir: "
placeholder=nombre del programa
icon-theme=Papirus-Gris
icons-enabled=yes
dpi-aware=no
width=40
lines=10
horizontal-pad=14
vertical-pad=12
inner-pad=8
line-height=24

[colors]
background=aaaaaaff
text=000000ff
prompt=000000ff
placeholder=555555ff
input=000000ff
match=000000ff
selection=ffffffff
selection-text=000000ff
selection-match=000000ff
border=000000ff

[border]
width=2
radius=0
