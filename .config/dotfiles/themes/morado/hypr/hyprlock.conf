# Neón palette
$bg     = rgb(120427)
$line   = rgb(3a1b6b)
$muted  = rgb(8a6bbd)
$text   = rgb(f6ecff)
$amber  = rgb(9d7bff)
$red    = rgb(ff3864)
$mono   = Share Tech Mono

general {
    hide_cursor = true
}

background {
    path = ~/.config/dotfiles/themes/current/wallpapers/rotation/a-atardecer.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
}

# Header: the tape is paused
label {
    text = <span color="##2de2e6">󰏤</span>  PAUSA  ·  SESIÓN BLOQUEADA
    color = $muted
    font_size = 12
    font_family = $mono
    position = 0, 190
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(9d7bff)
    font_size = 110
    font_family = Orbitron Black
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(9d7bffcc)
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A %d %B" | tr '[:lower:]' '[:upper:]'
    color = $muted
    font_size = 13
    font_family = $mono
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    size = 280, 44
    outline_thickness = 1
    rounding = 0
    outer_color = $amber
    inner_color = $bg
    font_color = $text
    font_family = $mono
    check_color = $amber
    fail_color = $red
    fail_text = ACCESO DENEGADO
    placeholder_text = <span color="##8a6bbd">CONTRASEÑA</span>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    text = cmd[update:30000] echo "$(whoami | tr a-z A-Z)  ·  BAT $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 10
    font_family = $mono
    position = 0, 40
    halign = center
    valign = bottom
}
