# Yoru palette
$bg     = rgb(15102a)
$line   = rgb(40316a)
$muted  = rgb(8f80b8)
$text   = rgb(f1edf8)
$amber  = rgb(b79bff)
$red    = rgb(ff6b6b)
$mono   = M PLUS 1 Code

general {
    hide_cursor = true
}

background {
    path = ~/.config/dotfiles/themes/current/wallpapers/rotation/a-calle.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
}

# Header: "closed", the sign on a shop door
label {
    text = 閉店
    color = $muted
    font_size = 26
    font_family = Dela Gothic One
    position = 0, 190
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(b79bff)
    font_size = 110
    font_family = Dela Gothic One Black
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(9d7bffcc)
    position = 0, 80
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A %d %B" | tr '[:lower:]' '[:upper:]'
    color = $muted
    font_size = 13
    font_family = $mono
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    size = 280, 44
    outline_thickness = 1
    rounding = 0
    outer_color = $amber
    inner_color = $bg
    font_color = $text
    font_family = $mono
    check_color = $amber
    fail_color = $red
    fail_text = ACCESO DENEGADO
    placeholder_text = <span color="##8f80b8">CONTRASEÑA</span>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    text = cmd[update:30000] echo "$(whoami | tr a-z A-Z)  ·  BAT $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 10
    font_family = $mono
    position = 0, 40
    halign = center
    valign = bottom
}
