[main]
font=M PLUS 1 Code:size=11:weight=medium
terminal=alacritty -e
prompt="夜  "
placeholder=Buscar
icon-theme=Papirus-Morado
icons-enabled=yes
dpi-aware=no
width=38
lines=24
anchor=right
x-margin=8
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=22
letter-spacing=0.5

# Yoru palette
[colors]
background=0e0a1aee
text=c4bbdcff
prompt=b79bffff
placeholder=5c4b8aff
input=f1edf8ff
match=ffcf6bff
selection=2a2048ff
selection-text=f1edf8ff
selection-match=ffcf6bff
border=b79bffff

[border]
width=1
radius=2
